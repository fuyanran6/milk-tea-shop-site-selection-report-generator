[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "milk-tea-shop-site-selection"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn==0.32.1",
    "jinja2==3.1.4",
    "python-multipart==0.0.12",
    "httpx==0.27.2",
    "pyyaml==6.0.2",
    "python-dotenv==1.0.1",
    "python-docx==1.1.2",
    "lxml>=5.0.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.vercel]
entrypoint = "app.main:app"
